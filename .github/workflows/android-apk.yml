name: Build Android APK

on:
  push:
    branches: [main, master]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Prebuild native android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone release APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Sign release APK for installation
        working-directory: mobile/android
        shell: bash
        run: |
          unsigned_apk=$(find app/build/outputs/apk/release -name '*unsigned*.apk' | head -n 1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)
          "$apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias AndroidDebugKey --out app/build/outputs/apk/release/app-release.apk "$unsigned_apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: velaiconnect-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
