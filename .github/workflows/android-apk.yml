name: Build Android APK

on:
  push:
    branches: [main, master]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Prebuild native android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone release APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Generate temporary signing key
        run: keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias AndroidDebugKey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign release APK for installation
        working-directory: mobile/android
        shell: bash
        run: |
          apk_dir=app/build/outputs/apk/release
          unsigned_apk=$(find "$apk_dir" -type f -name '*unsigned*.apk' -print -quit)
          if [[ -z "$unsigned_apk" ]]; then
            unsigned_apk=$(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print -quit)
          fi
          if [[ -z "$unsigned_apk" ]]; then
            echo "No release APK found in $apk_dir"
            find app/build/outputs -type f -print || true
            exit 1
          fi

          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)
          if "$apksigner" verify "$unsigned_apk" >/dev/null 2>&1; then
            if [[ "$unsigned_apk" != "$apk_dir/app-release.apk" ]]; then
              cp "$unsigned_apk" "$apk_dir/app-release.apk"
            fi
          else
            signed_apk="$RUNNER_TEMP/app-release.apk"
            "$apksigner" sign --ks "$RUNNER_TEMP/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias AndroidDebugKey --out "$signed_apk" "$unsigned_apk"
            mv "$signed_apk" "$apk_dir/app-release.apk"
          fi
          "$apksigner" verify "$apk_dir/app-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: velaiconnect-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
